<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="1100" cy="100" r="250" fill="#fff" opacity="0.03"/>
  <!-- Logo icon -->
  <circle cx="600" cy="200" r="60" stroke="#fff" stroke-width="8" fill="none" opacity="0.9"/>
  <circle cx="600" cy="200" r="22" fill="#fff" opacity="0.85"/>
  <!-- School name -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="72" fill="#fff">Ousia School</text>
  <!-- Tagline -->
  <text x="600" y="410" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="36" fill="#fff" opacity="0.85">英語 × AI で未来を切り拓く</text>
  <!-- Sub tagline -->
  <text x="600" y="470" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-weight="400" font-size="22" fill="#fff" opacity="0.6">次世代オンラインスクール ─ 平日は試験対策、休日は探究学習</text>
  <!-- Bottom bar -->
  <rect x="480" y="530" width="240" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>
  <text x="600" y="570" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="18" fill="#fff" opacity="0.5">ousia-school.ai</text>
</svg>
